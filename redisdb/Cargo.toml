[package]
name = "redisops"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-recursion = "1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1

[profile.release-zt]
inherits = "release"
opt-level = 3
lto = true

[[bin]]
name = "redisops"
path = "src/main.rs"

[[bin]]
name = "redisops-tui"
path = "src/bin/redis-tui.rs"

[dev-dependencies]
rand = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "store_bench"
harness = false
