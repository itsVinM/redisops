[package]
name = "redisops"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.29"
crossterm = "0.28"

[[bin]]
name = "redisops"
path = "src/main.rs"

[[bin]]
name = "redisops-tui"
path = "src/bin/redis-tui.rs"

[dev-dependencies]
rand = "0.8"
